name: GHCR container images
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to build
        required: true
        default: v0.1.0
permissions:
  contents: read
  packages: write
concurrency:
  group: ghcr-release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Validate stable release tag
        id: version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Record source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build native runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=container-${{ matrix.architecture }}
          cache-to: type=gha,scope=container-${{ matrix.architecture }},mode=max
      - name: Verify runtime and authenticated probes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.architecture }}
        run: |
          image="$IMAGE:$VERSION-$ARCH"
          test "$(docker run --rm "$image" --version)" = "filtr $VERSION"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = '10001:10001'
          FILTR_ADMIN_TOKEN=$(openssl rand -hex 64)
          export FILTR_ADMIN_TOKEN
          docker run --detach --name filtr-container-check --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            --env FILTR_ADMIN_TOKEN "$image" --upstream http://127.0.0.1:3000
          trap 'docker rm --force filtr-container-check >/dev/null' EXIT
          for _ in $(seq 1 30); do
            if docker exec filtr-container-check filtr-probe live; then break; fi
            sleep 1
          done
          docker exec filtr-container-check filtr-probe live
          docker exec -i filtr-container-check sh -c 'cat > /data/candidate.json' < examples/sbom.cdx.json
          docker exec filtr-container-check sh -ec '
            printf "header = \"Authorization: Bearer %s\"\n" "$FILTR_ADMIN_TOKEN" |
              curl --config - --noproxy "*" --fail --silent --show-error \
                http://127.0.0.1:9090/v1/sbom -H "Content-Type: application/json" \
                --data-binary @/data/candidate.json --output /dev/null
          '
          docker exec filtr-container-check filtr-probe ready
          test "$(docker exec filtr-container-check curl --noproxy '*' --silent \
            --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/.env)" = 403
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.architecture }}
        run: |
          image="$IMAGE:$VERSION-$ARCH"
          docker push "$image"
          mkdir digests
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' > "digests/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: container-digest-${{ matrix.architecture }}
          path: digests/*
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: container-digest-*
          path: digests
          merge-multiple: true
      - name: Publish multi-architecture version and latest tags
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mapfile -t sources < <(cat digests/amd64 digests/arm64)
          docker buildx imagetools create \
            --tag "$IMAGE:$version" --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
