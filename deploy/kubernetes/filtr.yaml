apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filtr-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filtr
  labels:
    app.kubernetes.io/name: filtr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: filtr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filtr
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: filtr
          # Replace with your own built image, preferably pinned by digest.
          image: ghcr.io/your-org/filtr:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Replace with the application Service that this Filtr instance protects.
            - name: FILTR_UPSTREAM
              value: http://application.default.svc.cluster.local:3000
            # Expired component reviews are automatically rechecked once a day.
            - name: FILTR_AI_CACHE_TTL_SECS
              value: "86400"
            # Availability-oriented default; critical emergency escalation is opt-in.
            - name: FILTR_AUTO_BLOCK_CRITICAL
              value: "false"
            # Optionally add FILTR_AI_MODEL here to pin a native provider model.
            # Optional SRE notifications: add FILTR_WEBHOOK_URL and
            # FILTR_WEBHOOK_TIMEOUT_SECS; load FILTR_WEBHOOK_TOKEN from a Secret.
            - name: FILTR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: filtr-admin
                  key: FILTR_ADMIN_TOKEN
          envFrom:
            - secretRef:
                name: filtr-ai
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            exec:
              command: [/usr/local/bin/filtr-probe, live]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 192
          livenessProbe:
            exec:
              command: [/usr/local/bin/filtr-probe, live]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [/usr/local/bin/filtr-probe, ready]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: filtr-data
---
apiVersion: v1
kind: Service
metadata:
  name: filtr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: filtr
  ports:
    - name: http
      port: 8080
      targetPort: http
