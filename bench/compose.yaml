services:
  origin:
    build:
      context: ..
      target: demo
    cpus: 2.0
    mem_limit: 256m
    environment:
      TOKIO_WORKER_THREADS: "2"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  filtr:
    image: ${FILTR_BENCH_IMAGE:-ghcr.io/meiroio/filtr:0.1.1}
    cpus: 2.0
    mem_limit: 512m
    environment:
      FILTR_UPSTREAM: http://origin:3000
      FILTR_ADMIN_TOKEN: ${FILTR_ADMIN_TOKEN:?Generated by bench/run.py}
      TOKIO_WORKER_THREADS: "2"
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [origin]
  baseline:
    extends:
      service: filtr
    image: ${FILTR_BENCH_BASELINE_IMAGE:-ghcr.io/meiroio/filtr:0.1.0@sha256:5333b0a0101a08ee902c90e68bc36fa44eba1ec9948be050f65648837a52bc03}
    profiles: [comparison]
  loadgen:
    build: .
    cpus: 2.0
    mem_limit: 2g
    volumes:
      - ${FILTR_BENCH_INPUT:?Created by bench/run.py}:/input:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: [tools]
