[package]
name = "filtr"
version = "0.1.0"
edition = "2024"
description = "An SBOM-aware HTTP firewall reverse proxy"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
arc-swap = "1.7"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = "0.3"
memchr = "2.8.3"
packageurl = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
